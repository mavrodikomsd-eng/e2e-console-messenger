services:
  mesh-server:
    build: .
    container_name: mesh-server
    ports:
      - "1301:1301"
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
      # Файловые бинды: сервер и клиенты ОБЯЗАНЫ использовать один secret.key,
      # иначе E2E-команды не расшифруются (старые named volumes давали серверу
      # свой отдельный ключ). Файлы должны существовать до `up`.
      - ./secret.key:/app/secret.key:ro
      - ./accounts.json:/app/accounts.json
    environment:
      - MESH_HOST=0.0.0.0
      - MESH_PORT=1301
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1301 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  mesh-admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: mesh-admin
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./accounts.json:/app/accounts.json
    environment:
      # ⚠ ЗАДАЙТЕ СВОЙ: MESH_WEB_PASS=... в shell или .env. Дефолт ниже —
      # только для локального демо, админка при старте громко предупредит.
      - MESH_WEB_PASS=${MESH_WEB_PASS:-admin123}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      mesh-server:
        condition: service_healthy
